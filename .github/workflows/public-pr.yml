name: Public PR checks

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "build/**"
      - "db/**"
      - "drizzle/**"
      - "examples/**"
      - "public/**"
      - "shared/**"
      - "tests/**"
      - "worker/**"
      - "README*"
      - "drizzle.config.ts"
      - "eslint.config.mjs"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - "postcss.config.mjs"
      - "tsconfig.json"
      - "vite.config.ts"
      - "wrangler.jsonc"
      - "wrangler.example.jsonc"
      - ".github/workflows/public-pr.yml"

permissions:
  contents: read

concurrency:
  group: public-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  public:
    name: Public tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Public tests and production build
        run: npm test
