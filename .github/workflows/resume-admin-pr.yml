name: Resume Admin PR checks

on:
  pull_request:
    branches:
      - main
    paths:
      - "resume-admin/**"
      - ".github/workflows/resume-admin-pr.yml"

permissions:
  contents: read

concurrency:
  group: resume-admin-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  frontend-worker:
    name: Frontend, Worker, build, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: resume-admin
    steps:
      - name: Check out PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: resume-admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend and repository tests
        run: npm test

      - name: Run Worker tests
        run: npm test -- tests/*-worker.test.ts

      - name: Build with synthetic CI-only Supabase inputs
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
        run: npm run build

      - name: Audit dependencies
        run: npm audit

  migration-consistency:
    name: Verify production migration staging
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify approved production migration staging
        shell: bash
        run: |
          set -euo pipefail
          p0="20261031120001_p0_identity_scoped_activity_log.sql"
          retention="20261031150000_profile_image_history_retention.sql"
          cli_dir="resume-admin/supabase/migrations"
          runtime_dir="resume-admin/tests/rls-runtime/supabase/migrations"
          test "$(find "${cli_dir}" -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort | tr '\n' ' ')" = "${p0} ${retention} "
          test -f "${runtime_dir}/20261031110000_test_only_installed_baseline_delta.sql"
          test ! -e "${cli_dir}/20261031110000_test_only_installed_baseline_delta.sql"
          for migration in "${p0}" "${retention}"; do
            canonical="resume-admin/migrations/${migration}"
            cmp "${canonical}" "${cli_dir}/${migration}"
            cmp "${canonical}" "${runtime_dir}/${migration}"
          done
          printf '%s  %s\n' \
            "da5a755e903a10693e7c5ba3924afaf0218aec156f8d86421e3aba2819186950" \
            "resume-admin/migrations/${p0}" | sha256sum --check
          printf '%s  %s\n' \
            "089c08a2da05bb881368faedb4d078a39f26d456d78c0f39381959be567212d3" \
            "resume-admin/migrations/${retention}" | sha256sum --check

  local-sql:
    name: Local Supabase SQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.119.0

      - name: Start disposable test-only Supabase and run SQL tests
        working-directory: resume-admin/tests/rls-runtime
        run: |
          supabase start
          supabase db reset --local
          supabase test db --local
